<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credits Animations</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --page:#F4EEDF; --text:#263046; --muted:#6E7191; --leaf:#4CC35A; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--text); font:15px/1.4 "Nunito", system-ui, sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:20px 16px 40px; }
  h1 { margin:0 0 4px; font-size:26px; }
  .lead { color:var(--muted); margin:0 0 12px; max-width:760px; }
  .replay { font:inherit; font-weight:800; border:0; border-radius:14px; padding:10px 18px; background:var(--leaf); color:#fff; box-shadow:0 4px 0 #2E9142; cursor:pointer; margin-bottom:18px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(350px, 1fr)); gap:22px 18px; }
  .opt h2 { margin:8px 4px 2px; font-size:18px; }
  .opt h2 b { display:inline-grid; place-items:center; width:28px; height:28px; border-radius:9px; background:var(--leaf); color:#fff; margin-right:6px; font-size:16px; }
  .opt p { margin:0 4px; color:var(--muted); font-size:14px; }
  .shot { width:340px; height:303px; margin:0 auto; border-radius:22px; overflow:hidden; position:relative; border:6px solid #263046; }
  .screen { width:390px; height:360px; transform:scale(.8410); transform-origin:0 0; position:relative; background:#4CC35A url(base.png) 0 -560px/390px 844px no-repeat; font-family:Fredoka, system-ui, sans-serif; }
  .cover { position:absolute; left:0; right:0; top:170px; bottom:0; background:#4CC35A; }
  .credits { position:absolute; left:0; right:0; top:176px; display:flex; flex-direction:column; align-items:center; color:#fff; }
  .ver { position:absolute; left:0; right:0; bottom:12px; text-align:center; font-size:13px; font-weight:600; color:#ffffffb3; }
  .ribbon { position:relative; margin-bottom:8px; }
  .ribbon .tail { position:absolute; top:8px; width:30px; height:28px; background:#F2A100; }
  .ribbon .tail.l { left:-18px; clip-path:polygon(0 0,100% 0,100% 100%,0 100%,30% 50%); }
  .ribbon .tail.r { right:-18px; clip-path:polygon(0 0,100% 0,70% 50%,100% 100%,0 100%); }
  .ribbon .band { position:relative; background:#FFC93C; color:#5B3A00; font-weight:700; font-size:13px; letter-spacing:1.5px; padding:7px 18px; border-radius:4px; box-shadow:0 3px 0 #F2A100; white-space:nowrap; }
  .pill { background:#fff; color:#263046; border-radius:99px; padding:4px 16px; margin:3px 0; font-size:15px; font-weight:700; box-shadow:0 3px 0 #2E9142; white-space:nowrap; }
  .play * { animation-fill-mode:both; }

  /* 1 now: quick rise */
  @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  .a1 .ribbon { animation:rise .7s ease-out both; }
  .a1 .pill:nth-of-type(2) { animation:rise .7s ease-out .22s both; }
  .a1 .pill:nth-of-type(3) { animation:rise .7s ease-out .44s both; }

  /* 2 slow gentle fade */
  @keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  .a2 .ribbon { animation:fadeUp 1.2s ease-out .2s both; }
  .a2 .pill:nth-of-type(2) { animation:fadeUp 1.3s ease-out 1.0s both; }
  .a2 .pill:nth-of-type(3) { animation:fadeUp 1.3s ease-out 1.8s both; }

  /* 3 bubbly pop */
  @keyframes pop { 0% { opacity:0; transform:scale(.2); } 60% { opacity:1; transform:scale(1.12); } 80% { transform:scale(.96); } 100% { transform:scale(1); } }
  .a3 .ribbon { animation:pop .9s ease-out .2s both; }
  .a3 .pill:nth-of-type(2) { animation:pop .9s ease-out .9s both; }
  .a3 .pill:nth-of-type(3) { animation:pop .9s ease-out 1.6s both; }

  /* 4 sprout up from the grass */
  @keyframes sprout { 0% { opacity:0; transform:scaleY(0) scaleX(.6); } 50% { opacity:1; transform:scaleY(1.15) scaleX(.9); } 75% { transform:scaleY(.94) scaleX(1.04); } 100% { transform:none; } }
  @keyframes leaf { 0%, 60% { opacity:0; transform:scale(0) rotate(-40deg); } 100% { opacity:1; transform:none; } }
  .a4 .ribbon { animation:sprout 1s ease-out .2s both; transform-origin:50% 100%; }
  .a4 .pill { position:relative; transform-origin:50% 100%; }
  .a4 .pill:nth-of-type(2) { animation:sprout 1.1s ease-out 1.0s both; }
  .a4 .pill:nth-of-type(3) { animation:sprout 1.1s ease-out 1.7s both; }
  .a4 .pill::after { content:''; position:absolute; right:-10px; top:-8px; width:18px; height:11px; border-radius:100% 0; background:#7BE07F; border:2px solid #2E9142; animation:leaf 1.3s ease-out both; animation-delay:inherit; }
  .a4 .pill:nth-of-type(2)::after { animation-delay:1.2s; }
  .a4 .pill:nth-of-type(3)::after { animation-delay:1.9s; }

  /* 5 typewriter letters */
  .a5 .ribbon { animation:rise .8s ease-out .2s both; }
  .a5 .pill { animation:rise .4s ease-out both; }
  .a5 .pill:nth-of-type(2) { animation-delay:.8s; }
  .a5 .pill:nth-of-type(3) { animation-delay:1.8s; }
  .a5 .pill span { opacity:0; animation:show .01s linear both; }
  @keyframes show { to { opacity:1; } }

  /* 6 slide in from the sides */
  @keyframes fromLeft { from { opacity:0; transform:translateX(-140px) rotate(-6deg); } 70% { opacity:1; transform:translateX(8px) rotate(1deg); } to { transform:none; } }
  @keyframes fromRight { from { opacity:0; transform:translateX(140px) rotate(6deg); } 70% { opacity:1; transform:translateX(-8px) rotate(-1deg); } to { transform:none; } }
  @keyframes drop { from { opacity:0; transform:translateY(-30px); } 70% { opacity:1; transform:translateY(4px); } to { transform:none; } }
  .a6 .ribbon { animation:drop .9s ease-out .2s both; }
  .a6 .pill:nth-of-type(2) { animation:fromLeft 1.1s ease-out 1.0s both; }
  .a6 .pill:nth-of-type(3) { animation:fromRight 1.1s ease-out 1.6s both; }

  /* 7 ribbon unrolls, names swing down on strings */
  @keyframes unroll { from { clip-path:inset(0 50% 0 50%); } to { clip-path:inset(0 0 0 0); } }
  @keyframes swing { 0% { opacity:0; transform:translateY(-24px) rotate(-14deg); } 40% { opacity:1; transform:translateY(0) rotate(10deg); } 65% { transform:rotate(-6deg); } 85% { transform:rotate(3deg); } 100% { transform:none; } }
  .a7 .ribbon { animation:unroll 1.1s ease-out .2s both; }
  .a7 .pill { transform-origin:50% -10px; }
  .a7 .pill:nth-of-type(2) { animation:swing 1.6s ease-out 1.1s both; }
  .a7 .pill:nth-of-type(3) { animation:swing 1.6s ease-out 1.7s both; }

  /* 8 flip like a card */
  @keyframes flip { from { opacity:0; transform:perspective(400px) rotateX(-90deg); } 60% { opacity:1; transform:perspective(400px) rotateX(15deg); } to { transform:perspective(400px) rotateX(0); } }
  .a8 .ribbon { animation:flip 1s ease-out .2s both; transform-origin:50% 0; }
  .a8 .pill { transform-origin:50% 0; }
  .a8 .pill:nth-of-type(2) { animation:flip 1.1s ease-out 1.0s both; }
  .a8 .pill:nth-of-type(3) { animation:flip 1.1s ease-out 1.7s both; }

  /* 9 float up like balloons */
  @keyframes float { 0% { opacity:0; transform:translateY(90px) scale(.8); } 70% { opacity:1; transform:translateY(-6px) scale(1.02); } 100% { transform:none; } }
  @keyframes bob { 0%, 100% { transform:translateY(0); } 50% { transform:translateY(-3px); } }
  .a9 .ribbon { animation:float 1.4s ease-out .2s both; }
  .a9 .pill:nth-of-type(2) { animation:float 1.6s ease-out .9s both, bob 2.4s ease-in-out 2.5s infinite; }
  .a9 .pill:nth-of-type(3) { animation:float 1.6s ease-out 1.5s both, bob 2.4s ease-in-out 3.1s infinite; }
</style>
</head>
<body>
<div class="wrap">
  <h1>How the names appear: pick an animation</h1>
  <p class="lead">Each one plays slowly during the 3-second loading screen. They replay on their own every few seconds, or tap Replay all. Number 1 is how it works now.</p>
  <button class="replay" onclick="playAll()">REPLAY ALL</button>
  <div class="grid" id="grid"></div>
</div>
<script>
const names = ['Elyssa Jean Vicencio', 'Ma. Cristine Joy Cristobal'];
const options = [
  ['Now: quick rise', 'What the app does today: everything slides up a little, fast.'],
  ['Slow gentle fade', 'The ribbon, then each name, softly fades in while drifting up. Calm and simple.'],
  ['Bubbly pop', 'Each piece pops in from small, bounces a bit bigger, then settles, like a bubble.'],
  ['Sprout up', 'Each pill grows up out of the grass like a seedling, and a little leaf unfolds on its corner.'],
  ['Typewriter', 'The names are typed out letter by letter, as if someone is writing them.'],
  ['From the sides', 'The ribbon drops in, then one name slides in from the left and the other from the right.'],
  ['Unroll and swing', 'The ribbon unrolls from the middle, then each name swings down on a string like a hanging sign.'],
  ['Card flip', 'Each piece flips down into place like a card turning over.'],
  ['Floating balloons', 'Everything floats up from below like balloons, then the names keep bobbing gently.'],
];
function card(i) {
  const typed = i === 4;
  const pill = (n, start) => typed
    ? `<div class="pill">${[...n].map((ch, k) => `<span style="animation-delay:${(start + k * 0.045).toFixed(3)}s">${ch === ' ' ? '&nbsp;' : ch}</span>`).join('')}</div>`
    : `<div class="pill">${n}</div>`;
  return `<div class="credits a${i + 1} play"><div class="ribbon"><div class="tail l"></div><div class="tail r"></div><div class="band">A PLANTQUEST STORY BY</div></div>${pill(names[0], 0.9)}${pill(names[1], 1.9)}</div>`;
}
document.getElementById('grid').innerHTML = options.map(([t, line], i) => `
  <div class="opt"><div class="shot"><div class="screen"><div class="cover"></div><div class="slot" data-i="${i}">${card(i)}</div><div class="ver">Version 2.0.0</div></div></div>
  <h2><b>${i + 1}</b>${t}</h2><p>${line}</p></div>`).join('');
function playAll() {
  document.querySelectorAll('.slot').forEach(s => { s.innerHTML = card(+s.dataset.i); });
}
setInterval(playAll, 5500);
</script>
</body>
</html>
