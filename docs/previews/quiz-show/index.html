<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Show Styles</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root { --page:#F4EEDF; --card:#fff; --border:#F0E6D0; --deep:#E3D6BA; --text:#263046; --muted:#6E7191;
          --leaf:#4CC35A; --leafDark:#2E9142; --leafTint:#E6F8DD; --sky:#6EC6FF; --skyDark:#3BA4E6; --skyTint:#E5F5FF;
          --sun:#FFC93C; --sunDark:#F2A100; --sunTint:#FFF1C7; --grape:#8E6CFF; --grapeDark:#6B4FD8; --grapeTint:#EFEAFF;
          --coral:#FF7A59; --coralTint:#FFE8E0; --bg:#FFF9EC; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--text); font:15px/1.4 "Nunito", system-ui, sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:20px 16px 40px; }
  h1 { margin:0 0 4px; font-size:26px; }
  .lead { color:var(--muted); margin:0 0 18px; max-width:760px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(350px, 1fr)); gap:26px 18px; }
  .opt h2 { margin:10px 4px 2px; font-size:19px; }
  .opt h2 b { display:inline-grid; place-items:center; width:28px; height:28px; border-radius:9px; background:var(--leaf); color:#fff; margin-right:6px; font-size:16px; }
  .opt p { margin:0 4px; color:var(--muted); font-size:14px; }
  .phone { width:340px; height:700px; margin:0 auto; border:10px solid #263046; border-radius:38px; overflow:hidden; position:relative; background:var(--bg); font-family:"Fredoka", system-ui, sans-serif; }
  .scroll { position:absolute; inset:0 0 62px 0; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; }
  .scroll::-webkit-scrollbar { display:none; }
  .nav { position:absolute; left:0; right:0; bottom:0; height:62px; background:#fff; border-top:2px solid var(--border); display:flex; justify-content:space-around; align-items:center; font-size:11px; font-weight:600; color:var(--muted); }
  .nav span { display:grid; justify-items:center; gap:2px; }
  .nav span i { width:24px; height:24px; border-radius:8px; background:#EDE6D6; display:block; }
  .nav span.on { color:var(--text); } .nav span.on i { background:var(--sun); }
  .pad { padding:16px; }
  .row { display:flex; align-items:center; gap:10px; }
  .t-display { font-size:30px; font-weight:700; line-height:1.1; }
  .t-title { font-size:19px; font-weight:700; }
  .t-head { font-size:16px; font-weight:700; }
  .t-small { font-size:12.5px; color:var(--muted); font-weight:500; }
  .t-label { font-size:11px; font-weight:700; letter-spacing:1px; }
  .chip { display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:700; background:var(--leafTint); color:var(--leafDark); }
  .btn { display:block; text-align:center; font-weight:700; font-size:16px; padding:11px; border-radius:16px; background:var(--leaf); color:#fff; box-shadow:0 4px 0 var(--leafDark); }
  .card { background:#fff; border:2px solid var(--border); border-bottom-width:5px; border-radius:20px; padding:12px; }
  .pq { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .tile { background:#fff; border:2px solid var(--border); border-bottom-width:4px; border-radius:16px; padding:6px 4px; text-align:center; font-size:12px; font-weight:600; }
  .tile svg { display:block; margin:0 auto; }
  @keyframes bob { to { transform:translateY(-5px); } }
  .bob { animation:bob 1.3s ease-in-out infinite alternate; }
  @keyframes pulse { 50% { transform:scale(1.04); } }
  .pulse { animation:pulse 1.8s ease-in-out infinite; }
  @keyframes beam { from { opacity:.25; } to { opacity:.55; } }
  .beam { animation:beam 2.2s ease-in-out infinite alternate; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page:#1d2230; } h1, .opt h2 { color:#f2f2f5; } .lead, .opt p { color:#b5b8cc; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Quiz tab, game show: pick a style</h1>
  <p class="lead">Six takes on the game show idea. The stage at the top changes; underneath, every version keeps the bonus-round ticket (review), the challenge level, Match it and the plant "contestants". Each phone scrolls.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
const nav = `<div class="nav">${['Home','Plants','Quiz','Shop','Me'].map(n => `<span class="${n === 'Quiz' ? 'on' : ''}"><i></i>${n}</span>`).join('')}</div>`;
const binhi = (w = 56, extra = '') => `<svg width="${w}" height="${w * 1.15}" viewBox="0 0 44 50" style="flex:none" ${extra}><path d="M22 14 C22 6 16 2 10 4 C13 10 17 13 22 14 C23 7 29 3 35 5 C32 11 27 13 22 14" fill="#4CC35A" stroke="#2E9142" stroke-width="2"/><path d="M8 30 H36 L33 47 Q32 49 30 49 H14 Q12 49 11 47Z" fill="#E07A4E" stroke="#B5522B" stroke-width="2"/><rect x="6" y="26" width="32" height="6" rx="3" fill="#E9906A" stroke="#B5522B" stroke-width="2"/><circle cx="17" cy="38" r="2.4" fill="#263046"/><circle cx="27" cy="38" r="2.4" fill="#263046"/><path d="M19 43 Q22 46 25 43" stroke="#263046" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
const leafIcon = (s = 16, c = '#4CC35A') => `<svg width="${s}" height="${s}" viewBox="0 0 20 20" style="vertical-align:-3px"><path d="M4 16 C2 8 8 2 17 3 C18 12 12 18 4 16Z" fill="${c}" stroke="#2E9142" stroke-width="1.5"/><path d="M5 15 L13 7" stroke="#2E9142" stroke-width="1.3"/></svg>`;
const tick = (s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 20 20" style="vertical-align:-3px"><circle cx="10" cy="10" r="9" fill="#4CC35A" stroke="#2E9142" stroke-width="1.5"/><path d="M6 10 L9 13 L14 7" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const lock = (s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 20 20" style="vertical-align:-3px"><rect x="4" y="9" width="12" height="9" rx="2" fill="#C9BFA8"/><path d="M7 9 V6 a3 3 0 0 1 6 0 V9" stroke="#C9BFA8" stroke-width="2.2" fill="none"/></svg>`;

// Little plant drawings for the plant quizzes.
function plant(kind, s = 40) {
  const stem = `<path d="M20 38 V20" stroke="#2E9142" stroke-width="2.4"/>`;
  const pot = '';
  const bodies = {
    sampaguita: `${stem}<ellipse cx="13" cy="28" rx="6" ry="3" fill="#4CC35A" transform="rotate(-30 13 28)"/><ellipse cx="27" cy="27" rx="6" ry="3" fill="#4CC35A" transform="rotate(30 27 27)"/>${petals(20, 15, '#fff', 6)}`,
    gumamela: `${stem}<ellipse cx="13" cy="28" rx="7" ry="3.5" fill="#3E9A3A" transform="rotate(-30 13 28)"/><ellipse cx="27" cy="29" rx="7" ry="3.5" fill="#3E9A3A" transform="rotate(30 27 29)"/>${petals(20, 15, '#FF5C7A', 8)}`,
    makahiya: `<path d="M20 38 Q16 26 10 20 M20 38 Q24 26 30 18" stroke="#B5522B" stroke-width="2" fill="none"/>${[[10, 20], [30, 18]].map(([x, y]) => `<g>${Array.from({ length: 10 }, (_, i) => `<path d="M${x} ${y} l${Math.cos(i * 0.63) * 6} ${Math.sin(i * 0.63) * 6}" stroke="#FF8FB1" stroke-width="1.6"/>`).join('')}</g>`).join('')}<ellipse cx="20" cy="30" rx="8" ry="2.4" fill="#4CC35A"/>`,
    kalamansi: `<rect x="18" y="26" width="4" height="12" fill="#8A5A2B"/><circle cx="20" cy="18" r="12" fill="#3E9A3A" stroke="#2E7A2E" stroke-width="1.5"/>${[[14, 14], [25, 16], [18, 23], [27, 23]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.6" fill="#FF9F43"/>`).join('')}`,
    malunggay: `<path d="M20 38 V8" stroke="#8A5A2B" stroke-width="2.4"/>${[10, 16, 22, 28].map(y => `<g>${[-1, 1].map(d => Array.from({ length: 3 }, (_, i) => `<ellipse cx="${20 + d * (5 + i * 4)}" cy="${y + i}" rx="2.2" ry="1.4" fill="#4CC35A"/>`).join('')).join('')}</g>`).join('')}`,
    palay: `${Array.from({ length: 6 }, (_, i) => `<path d="M20 38 Q${12 + i * 3} 24 ${6 + i * 5.6} ${10 + (i % 2) * 4}" stroke="#7FB33A" stroke-width="2" fill="none"/>`).join('')}<path d="M24 14 q4 -2 6 2" stroke="#E2B13C" stroke-width="3" fill="none" stroke-linecap="round"/>`,
  };
  return `<svg width="${s}" height="${s}" viewBox="0 0 40 40">${pot}${bodies[kind]}</svg>`;
}
function petals(x, y, c, r) {
  return [0, 72, 144, 216, 288].map(a => `<ellipse cx="${x}" cy="${y - r * 0.55}" rx="${r * 0.42}" ry="${r * 0.62}" fill="${c}" stroke="#C9878F" stroke-width=".8" transform="rotate(${a} ${x} ${y})"/>`).join('') + `<circle cx="${x}" cy="${y}" r="${r * 0.32}" fill="#FFC93C"/>`;
}
// What the child has done (sample data).
const quizzes = [
  { id: 'sampaguita', name: 'Sampaguita', score: [3, 3] },
  { id: 'gumamela', name: 'Gumamela', score: [2, 3] },
  { id: 'makahiya', name: 'Makahiya', score: null },
  { id: 'kalamansi', name: 'Kalamansi', score: null },
  { id: 'malunggay', name: 'Malunggay', score: [1, 3] },
  { id: 'palay', name: 'Palay', score: null },
];
const scoreText = q => q.score ? `${q.score[0]}/${q.score[1]}` : 'New!';


// The part under the stage, the same in every version (themed colours).
function lower(o = {}) {
  const contest = o.contest || 'Contestants';
  return `<div class="pad" style="display:grid;gap:12px;${o.bg ? `background:${o.bg};` : ''}">
    <div style="position:relative;background:${o.ticket || 'var(--sun)'};border-radius:14px;padding:12px 14px 12px 18px;box-shadow:0 4px 0 ${o.ticketShadow || 'var(--sunDark)'}">
      <div style="position:absolute;left:-8px;top:50%;width:16px;height:16px;border-radius:50%;background:${o.bg || 'var(--bg)'};transform:translateY(-50%)"></div>
      <div style="position:absolute;right:-8px;top:50%;width:16px;height:16px;border-radius:50%;background:${o.bg || 'var(--bg)'};transform:translateY(-50%)"></div>
      <div class="t-label">BONUS ROUND</div>
      <div class="t-head">3 tricky questions · 2 plants to check on</div>
      <div class="t-small" style="color:#6b5200">+1 leaf for each one you get right</div>
    </div>
    <div class="card row" style="background:var(--grapeTint);border-color:#D9CCFF"><div style="flex:1"><div class="t-label" style="color:var(--grapeDark)">CHALLENGE</div><div class="t-head">Sapling Quiz</div><div class="t-small">10 questions · Grades 5–6</div></div><div class="chip" style="background:#fff;color:var(--grapeDark)">Best 6/10</div></div>
    <div class="card row"><svg width="40" height="40" viewBox="0 0 40 40"><circle cx="14" cy="20" r="11" fill="#FFC93C"/><circle cx="26" cy="20" r="11" fill="#FF7A59" opacity=".9"/></svg><div style="flex:1"><div class="t-head">Match it</div><div class="t-small">What is each plant known for?</div></div><span class="chip">+12</span></div>
    <div class="t-title" style="${o.dark ? 'color:#fff' : ''}">${contest}</div>
    <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:6px">
      ${quizzes.map(q => `<div style="flex:none;width:96px;background:#fff;border:2px solid var(--border);border-bottom-width:4px;border-radius:16px;padding:8px 4px;text-align:center"><div style="width:58px;height:58px;margin:0 auto;border-radius:50%;background:${q.score ? 'var(--leafTint)' : 'var(--sunTint)'};display:grid;place-items:center">${plant(q.id, 44)}</div><div style="font-size:12.5px;font-weight:600;margin-top:4px">${q.name}</div><div class="chip" style="margin-top:3px;${q.score ? '' : 'background:var(--sunTint);color:#8a6200'}">${scoreText(q)}</div></div>`).join('')}
    </div>
    <div class="t-small" style="${o.dark ? 'color:#C9C3F0' : ''}">${lock()} 9 more contestants join as you explore.</div>
  </div>`;
}
const playBall = (size = 150, label = 'Sprout Quiz') => `<div class="pulse" style="background:linear-gradient(#7BE07F,#4CC35A);border-radius:50%;width:${size}px;height:${size}px;display:grid;place-items:center;text-align:center;color:#fff;box-shadow:0 7px 0 #2E9142, 0 0 30px #A6E58A88;border:4px solid #fff">
  <div><div style="font-size:${size * 0.17}px;font-weight:700;line-height:1">PLAY</div><div style="font-size:${Math.max(12, size * 0.09)}px;font-weight:600">${label}</div><div style="font-size:${Math.max(11, size * 0.08)}px;opacity:.9">5 questions</div></div></div>`;

const variants = [];

// 1. The original A.
variants.push({
  name: 'Spotlight stage', line: 'The first version: purple stage, red curtains, two spotlights.',
  html: () => `<div class="scroll">
    <div style="position:relative;height:300px;background:radial-gradient(ellipse at 50% 30%, #6B4FD8, #2B1F5E 75%);overflow:hidden">
      <svg width="320" height="300" viewBox="0 0 320 300" style="position:absolute;inset:0">
        <path class="beam" d="M70 0 L20 300 H120Z" fill="#FFF1C7"/><path class="beam" d="M250 0 L200 300 H300Z" fill="#FFF1C7" style="animation-delay:1s"/>
        <path d="M0 0 H70 Q50 120 60 300 H0Z" fill="#E0465A"/><path d="M320 0 H250 Q270 120 260 300 H320Z" fill="#E0465A"/>
        <path d="M20 0 Q16 150 24 300 M46 0 Q38 150 44 300 M300 0 Q304 150 296 300 M274 0 Q282 150 276 300" stroke="#B5303F" stroke-width="3" fill="none"/>
        <path d="M0 0 H320 V24 Q300 40 280 24 Q260 40 240 24 Q220 40 200 24 Q180 40 160 24 Q140 40 120 24 Q100 40 80 24 Q60 40 40 24 Q20 40 0 24Z" fill="#FFC93C"/>
        <ellipse cx="160" cy="292" rx="140" ry="22" fill="#3B2C82"/>
      </svg>
      <div style="position:absolute;top:34px;left:0;right:0;text-align:center"><div class="t-label" style="color:#FFC93C">QUIZ SHOW</div><div class="t-display" style="color:#fff">Binhi's Quiz Time</div></div>
      <div class="bob" style="position:absolute;left:58px;top:132px">${binhi(64)}</div>
      <div style="position:absolute;left:134px;top:120px">${playBall()}</div>
    </div>${lower()}</div>${nav}`,
});

// 2. Daytime fiesta stage.
variants.push({
  name: 'Fiesta stage', line: 'A sunny outdoor barrio fiesta: banderitas flags, bamboo posts and a wooden stage.',
  html: () => `<div class="scroll">
    <div style="position:relative;height:300px;background:linear-gradient(#8FD3FF,#E3F6FF 70%);overflow:hidden">
      <svg width="320" height="300" viewBox="0 0 320 300" style="position:absolute;inset:0">
        <circle cx="282" cy="40" r="20" fill="#FFD95A"/>
        <rect x="14" y="20" width="12" height="250" fill="#C9A464" stroke="#8A5A2B" stroke-width="2.5"/><rect x="294" y="20" width="12" height="250" fill="#C9A464" stroke="#8A5A2B" stroke-width="2.5"/>
        ${[40, 70].map(y => `<path d="M20 ${y} Q160 ${y + 30} 300 ${y}" stroke="#8A5A2B" stroke-width="1.5" fill="none"/>` + Array.from({ length: 13 }, (_, i) => { const t = (i + 0.5) / 13, x = 20 + 280 * t, yy = y + 30 * 4 * t * (1 - t) * 0.5 * 2; return `<path d="M${x - 9} ${yy} L${x + 9} ${yy} L${x} ${yy + 16}Z" fill="${['#FF5C7A', '#FFC93C', '#6EC6FF', '#4CC35A', '#8E6CFF', '#FF9F43'][(i + y) % 6]}"/>`; }).join('')).join('')}
        <path d="M0 236 H320 V300 H0Z" fill="#B9893F"/>${Array.from({ length: 8 }, (_, i) => `<path d="M0 ${244 + i * 8} H320" stroke="#A47532" stroke-width="2"/>`).join('')}
        <path d="M0 236 H320" stroke="#8A5A2B" stroke-width="4"/>
        <rect x="70" y="104" width="180" height="34" rx="8" fill="#8A5A2B" stroke="#5B3A1E" stroke-width="2.5"/>
      </svg>
      <div style="position:absolute;top:110px;left:70px;width:180px;text-align:center;color:#fff;font-size:20px;font-weight:700">QUIZ FIESTA!</div>
      <div class="bob" style="position:absolute;left:40px;top:170px">${binhi(60)}</div>
      <div style="position:absolute;left:150px;top:148px">${playBall(124)}</div>
    </div>${lower()}</div>${nav}`,
});

// 3. Spinning wheel.
variants.push({
  name: 'Prize wheel', line: 'A big colourful wheel slowly turns behind the PLAY button, like a TV game show.',
  html: () => `<div class="scroll">
    <style>@keyframes spin { to { transform:rotate(360deg); } } .spin { animation:spin 24s linear infinite; transform-origin:160px 168px; }</style>
    <div style="position:relative;height:310px;background:radial-gradient(ellipse at 50% 55%, #1F7A8C, #0E3B4A 80%);overflow:hidden">
      <div style="position:absolute;top:16px;left:0;right:0;text-align:center"><div class="t-display" style="color:#fff">Spin & Play</div></div>
      <svg width="320" height="310" viewBox="0 0 320 310" style="position:absolute;inset:0">
        <circle cx="160" cy="168" r="118" fill="#FFC93C" stroke="#F2A100" stroke-width="6"/>
        <g class="spin">${Array.from({ length: 10 }, (_, i) => { const a1 = i * 36 * Math.PI / 180, a2 = (i + 1) * 36 * Math.PI / 180; return `<path d="M160 168 L${160 + 108 * Math.cos(a1)} ${168 + 108 * Math.sin(a1)} A108 108 0 0 1 ${160 + 108 * Math.cos(a2)} ${168 + 108 * Math.sin(a2)}Z" fill="${['#FF5C7A', '#6EC6FF', '#4CC35A', '#8E6CFF', '#FF9F43'][i % 5]}" stroke="#fff" stroke-width="2"/>`; }).join('')}
          ${Array.from({ length: 10 }, (_, i) => { const a = (i + 0.5) * 36 * Math.PI / 180; return `<g transform="translate(${160 + 82 * Math.cos(a) - 12} ${168 + 82 * Math.sin(a) - 12}) scale(.6)">${leafIcon(40, '#fff')}</g>`; }).join('')}</g>
        ${Array.from({ length: 20 }, (_, i) => { const a = i * 18 * Math.PI / 180; return `<circle cx="${160 + 113 * Math.cos(a)}" cy="${168 + 113 * Math.sin(a)}" r="3.2" fill="#fff" class="glow" style="animation-delay:${(i % 2) * 1.2}s"/>`; }).join('')}
        <path d="M148 44 L172 44 L160 66Z" fill="#E0465A" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      </svg>
      <div style="position:absolute;left:100px;top:108px">${playBall(120)}</div>
      <div class="bob" style="position:absolute;left:8px;top:236px">${binhi(56)}</div>
    </div>${lower()}</div>${nav}`,
});

// 4. Host podium and buzzer.
variants.push({
  name: 'Podium & buzzer', line: 'A TV studio: Binhi hosts from a podium, a scoreboard shows your best, and you press the big buzzer to play.',
  html: () => `<div class="scroll">
    <div style="position:relative;height:310px;background:linear-gradient(#21346E,#3A5BB8);overflow:hidden">
      <svg width="320" height="310" viewBox="0 0 320 310" style="position:absolute;inset:0">
        ${Array.from({ length: 7 }, (_, i) => `<rect x="${i * 48 - 8}" y="0" width="30" height="230" fill="#ffffff" opacity=".05"/>`).join('')}
        <rect x="70" y="20" width="180" height="70" rx="12" fill="#101A3A" stroke="#6EC6FF" stroke-width="3"/>
        <path d="M0 250 H320 V310 H0Z" fill="#1A2756"/><path d="M0 250 H320" stroke="#6EC6FF" stroke-width="3" opacity=".6"/>
        <path d="M30 170 H118 L110 262 H38Z" fill="#E0465A" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><rect x="24" y="160" width="100" height="14" rx="5" fill="#FFC93C" stroke="#fff" stroke-width="2.5"/>
        <rect x="216" y="210" width="36" height="52" fill="#C9CED8" stroke="#fff" stroke-width="2.5"/>
      </svg>
      <div style="position:absolute;left:70px;top:22px;width:180px;display:grid;grid-template-columns:1fr 1fr;text-align:center;color:#fff;font-family:monospace">
        <div style="padding-top:10px"><div style="font-size:11px;color:#6EC6FF">BEST</div><div style="font-size:24px;font-weight:700;color:#FFC93C">4/5</div></div>
        <div style="padding-top:10px"><div style="font-size:11px;color:#6EC6FF">LEAVES</div><div style="font-size:24px;font-weight:700;color:#A6E58A">5</div></div>
      </div>
      <div style="position:absolute;top:104px;left:110px;right:0;text-align:center"><div class="t-label" style="color:#FFC93C">LIVE</div><div class="t-title" style="color:#fff">Binhi's Quiz Time</div></div>
      <div class="bob" style="position:absolute;left:46px;top:110px">${binhi(56)}</div>
      <div style="position:absolute;left:52px;top:200px;color:#fff;font-weight:700;font-size:15px">HOST</div>
      <div class="pulse" style="position:absolute;left:176px;top:150px;width:116px;height:70px;border-radius:58px 58px 12px 12px;background:radial-gradient(circle at 40% 30%, #9BEA8F, #4CC35A 60%, #2E9142);border:4px solid #fff;display:grid;place-items:center;color:#fff;text-align:center;box-shadow:0 0 24px #A6E58A88">
        <div><div style="font-size:22px;font-weight:700;line-height:1">PLAY</div><div style="font-size:11px">Sprout · 5 q</div></div></div>
    </div>${lower()}</div>${nav}`,
});

// 5. Puppet theatre.
variants.push({
  name: 'Puppet theatre', line: 'A cosy wooden puppet booth; Binhi pops up in the window holding the PLAY sign.',
  html: () => `<div class="scroll" style="background:#FFF4E0">
    <div style="position:relative;height:310px;overflow:hidden;background:#FFF4E0;background-image:radial-gradient(#F4E2BE 1.5px, transparent 1.6px);background-size:14px 14px">
      <svg width="320" height="310" viewBox="0 0 320 310" style="position:absolute;inset:0">
        <path d="M30 60 Q160 6 290 60 V80 H30Z" fill="#8A5A2B" stroke="#5B3A1E" stroke-width="3"/>
        
        <rect x="30" y="78" width="260" height="226" fill="#B9893F" stroke="#5B3A1E" stroke-width="3"/>
