<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Tab Designs</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root { --page:#F4EEDF; --card:#fff; --border:#F0E6D0; --deep:#E3D6BA; --text:#263046; --muted:#6E7191;
          --leaf:#4CC35A; --leafDark:#2E9142; --leafTint:#E6F8DD; --sky:#6EC6FF; --skyDark:#3BA4E6; --skyTint:#E5F5FF;
          --sun:#FFC93C; --sunDark:#F2A100; --sunTint:#FFF1C7; --grape:#8E6CFF; --grapeDark:#6B4FD8; --grapeTint:#EFEAFF;
          --coral:#FF7A59; --coralTint:#FFE8E0; --bg:#FFF9EC; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--text); font:15px/1.4 "Nunito", system-ui, sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:20px 16px 40px; }
  h1 { margin:0 0 4px; font-size:26px; }
  .lead { color:var(--muted); margin:0 0 18px; max-width:760px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(350px, 1fr)); gap:26px 18px; }
  .opt h2 { margin:10px 4px 2px; font-size:19px; }
  .opt h2 b { display:inline-grid; place-items:center; width:28px; height:28px; border-radius:9px; background:var(--leaf); color:#fff; margin-right:6px; font-size:16px; }
  .opt p { margin:0 4px; color:var(--muted); font-size:14px; }
  .phone { width:340px; height:700px; margin:0 auto; border:10px solid #263046; border-radius:38px; overflow:hidden; position:relative; background:var(--bg); font-family:"Fredoka", system-ui, sans-serif; }
  .scroll { position:absolute; inset:0 0 62px 0; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; }
  .scroll::-webkit-scrollbar { display:none; }
  .nav { position:absolute; left:0; right:0; bottom:0; height:62px; background:#fff; border-top:2px solid var(--border); display:flex; justify-content:space-around; align-items:center; font-size:11px; font-weight:600; color:var(--muted); }
  .nav span { display:grid; justify-items:center; gap:2px; }
  .nav span i { width:24px; height:24px; border-radius:8px; background:#EDE6D6; display:block; }
  .nav span.on { color:var(--text); } .nav span.on i { background:var(--sun); }
  .pad { padding:16px; }
  .row { display:flex; align-items:center; gap:10px; }
  .t-display { font-size:30px; font-weight:700; line-height:1.1; }
  .t-title { font-size:19px; font-weight:700; }
  .t-head { font-size:16px; font-weight:700; }
  .t-small { font-size:12.5px; color:var(--muted); font-weight:500; }
  .t-label { font-size:11px; font-weight:700; letter-spacing:1px; }
  .chip { display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:700; background:var(--leafTint); color:var(--leafDark); }
  .btn { display:block; text-align:center; font-weight:700; font-size:16px; padding:11px; border-radius:16px; background:var(--leaf); color:#fff; box-shadow:0 4px 0 var(--leafDark); }
  .card { background:#fff; border:2px solid var(--border); border-bottom-width:5px; border-radius:20px; padding:12px; }
  .pq { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .tile { background:#fff; border:2px solid var(--border); border-bottom-width:4px; border-radius:16px; padding:6px 4px; text-align:center; font-size:12px; font-weight:600; }
  .tile svg { display:block; margin:0 auto; }
  @keyframes bob { to { transform:translateY(-5px); } }
  .bob { animation:bob 1.3s ease-in-out infinite alternate; }
  @keyframes pulse { 50% { transform:scale(1.04); } }
  .pulse { animation:pulse 1.8s ease-in-out infinite; }
  @keyframes beam { from { opacity:.25; } to { opacity:.55; } }
  .beam { animation:beam 2.2s ease-in-out infinite alternate; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page:#1d2230; } h1, .opt h2 { color:#f2f2f5; } .lead, .opt p { color:#b5b8cc; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Quiz tab: pick a design</h1>
  <p class="lead">Every design keeps the same things: smart review when something is waiting, your level quiz (big) and the challenge level, the Match it game, the plant quizzes with your scores, and how many more unlock. Each phone scrolls.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
const nav = `<div class="nav">${['Home','Plants','Quiz','Shop','Me'].map(n => `<span class="${n === 'Quiz' ? 'on' : ''}"><i></i>${n}</span>`).join('')}</div>`;
const binhi = (w = 56, extra = '') => `<svg width="${w}" height="${w * 1.15}" viewBox="0 0 44 50" style="flex:none" ${extra}><path d="M22 14 C22 6 16 2 10 4 C13 10 17 13 22 14 C23 7 29 3 35 5 C32 11 27 13 22 14" fill="#4CC35A" stroke="#2E9142" stroke-width="2"/><path d="M8 30 H36 L33 47 Q32 49 30 49 H14 Q12 49 11 47Z" fill="#E07A4E" stroke="#B5522B" stroke-width="2"/><rect x="6" y="26" width="32" height="6" rx="3" fill="#E9906A" stroke="#B5522B" stroke-width="2"/><circle cx="17" cy="38" r="2.4" fill="#263046"/><circle cx="27" cy="38" r="2.4" fill="#263046"/><path d="M19 43 Q22 46 25 43" stroke="#263046" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
const leafIcon = (s = 16, c = '#4CC35A') => `<svg width="${s}" height="${s}" viewBox="0 0 20 20" style="vertical-align:-3px"><path d="M4 16 C2 8 8 2 17 3 C18 12 12 18 4 16Z" fill="${c}" stroke="#2E9142" stroke-width="1.5"/><path d="M5 15 L13 7" stroke="#2E9142" stroke-width="1.3"/></svg>`;
const tick = (s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 20 20" style="vertical-align:-3px"><circle cx="10" cy="10" r="9" fill="#4CC35A" stroke="#2E9142" stroke-width="1.5"/><path d="M6 10 L9 13 L14 7" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const lock = (s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 20 20" style="vertical-align:-3px"><rect x="4" y="9" width="12" height="9" rx="2" fill="#C9BFA8"/><path d="M7 9 V6 a3 3 0 0 1 6 0 V9" stroke="#C9BFA8" stroke-width="2.2" fill="none"/></svg>`;

// Little plant drawings for the plant quizzes.
function plant(kind, s = 40) {
  const stem = `<path d="M20 38 V20" stroke="#2E9142" stroke-width="2.4"/>`;
  const pot = '';
  const bodies = {
    sampaguita: `${stem}<ellipse cx="13" cy="28" rx="6" ry="3" fill="#4CC35A" transform="rotate(-30 13 28)"/><ellipse cx="27" cy="27" rx="6" ry="3" fill="#4CC35A" transform="rotate(30 27 27)"/>${petals(20, 15, '#fff', 6)}`,
    gumamela: `${stem}<ellipse cx="13" cy="28" rx="7" ry="3.5" fill="#3E9A3A" transform="rotate(-30 13 28)"/><ellipse cx="27" cy="29" rx="7" ry="3.5" fill="#3E9A3A" transform="rotate(30 27 29)"/>${petals(20, 15, '#FF5C7A', 8)}`,
    makahiya: `<path d="M20 38 Q16 26 10 20 M20 38 Q24 26 30 18" stroke="#B5522B" stroke-width="2" fill="none"/>${[[10, 20], [30, 18]].map(([x, y]) => `<g>${Array.from({ length: 10 }, (_, i) => `<path d="M${x} ${y} l${Math.cos(i * 0.63) * 6} ${Math.sin(i * 0.63) * 6}" stroke="#FF8FB1" stroke-width="1.6"/>`).join('')}</g>`).join('')}<ellipse cx="20" cy="30" rx="8" ry="2.4" fill="#4CC35A"/>`,
    kalamansi: `<rect x="18" y="26" width="4" height="12" fill="#8A5A2B"/><circle cx="20" cy="18" r="12" fill="#3E9A3A" stroke="#2E7A2E" stroke-width="1.5"/>${[[14, 14], [25, 16], [18, 23], [27, 23]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.6" fill="#FF9F43"/>`).join('')}`,
    malunggay: `<path d="M20 38 V8" stroke="#8A5A2B" stroke-width="2.4"/>${[10, 16, 22, 28].map(y => `<g>${[-1, 1].map(d => Array.from({ length: 3 }, (_, i) => `<ellipse cx="${20 + d * (5 + i * 4)}" cy="${y + i}" rx="2.2" ry="1.4" fill="#4CC35A"/>`).join('')).join('')}</g>`).join('')}`,
    palay: `${Array.from({ length: 6 }, (_, i) => `<path d="M20 38 Q${12 + i * 3} 24 ${6 + i * 5.6} ${10 + (i % 2) * 4}" stroke="#7FB33A" stroke-width="2" fill="none"/>`).join('')}<path d="M24 14 q4 -2 6 2" stroke="#E2B13C" stroke-width="3" fill="none" stroke-linecap="round"/>`,
  };
  return `<svg width="${s}" height="${s}" viewBox="0 0 40 40">${pot}${bodies[kind]}</svg>`;
}
function petals(x, y, c, r) {
  return [0, 72, 144, 216, 288].map(a => `<ellipse cx="${x}" cy="${y - r * 0.55}" rx="${r * 0.42}" ry="${r * 0.62}" fill="${c}" stroke="#C9878F" stroke-width=".8" transform="rotate(${a} ${x} ${y})"/>`).join('') + `<circle cx="${x}" cy="${y}" r="${r * 0.32}" fill="#FFC93C"/>`;
}
// What the child has done (sample data).
const quizzes = [
  { id: 'sampaguita', name: 'Sampaguita', score: [3, 3] },
  { id: 'gumamela', name: 'Gumamela', score: [2, 3] },
  { id: 'makahiya', name: 'Makahiya', score: null },
  { id: 'kalamansi', name: 'Kalamansi', score: null },
  { id: 'malunggay', name: 'Malunggay', score: [1, 3] },
  { id: 'palay', name: 'Palay', score: null },
];
const scoreText = q => q.score ? `${q.score[0]}/${q.score[1]}` : 'New!';

const designs = [];

// ---------------------------------------------------------------- A
designs.push({
  name: 'Game show stage', line: 'Binhi hosts a quiz show. The big glowing button starts your level; review is the "bonus round".',
  html: () => `<div class="scroll">
    <div style="position:relative;height:300px;background:radial-gradient(ellipse at 50% 30%, #6B4FD8, #2B1F5E 75%);overflow:hidden">
      <svg width="320" height="300" viewBox="0 0 320 300" style="position:absolute;inset:0">
        <path class="beam" d="M70 0 L20 300 H120Z" fill="#FFF1C7"/><path class="beam" d="M250 0 L200 300 H300Z" fill="#FFF1C7" style="animation-delay:1s"/>
        <path d="M0 0 H70 Q50 120 60 300 H0Z" fill="#E0465A"/><path d="M320 0 H250 Q270 120 260 300 H320Z" fill="#E0465A"/>
        <path d="M20 0 Q16 150 24 300 M46 0 Q38 150 44 300 M300 0 Q304 150 296 300 M274 0 Q282 150 276 300" stroke="#B5303F" stroke-width="3" fill="none"/>
        <path d="M0 0 H320 V24 Q300 40 280 24 Q260 40 240 24 Q220 40 200 24 Q180 40 160 24 Q140 40 120 24 Q100 40 80 24 Q60 40 40 24 Q20 40 0 24Z" fill="#FFC93C"/>
        <ellipse cx="160" cy="292" rx="140" ry="22" fill="#3B2C82"/>
      </svg>
      <div style="position:absolute;top:34px;left:0;right:0;text-align:center;color:#fff">
        <div class="t-label" style="color:#FFC93C">QUIZ SHOW</div>
        <div class="t-display" style="color:#fff">Binhi's Quiz Time</div>
      </div>
      <div class="bob" style="position:absolute;left:58px;top:132px">${binhi(64)}</div>
      <div style="position:absolute;left:118px;top:120px;right:22px">
        <div class="pulse" style="background:linear-gradient(#7BE07F,#4CC35A);border-radius:50%;width:150px;height:150px;margin-left:16px;display:grid;place-items:center;text-align:center;color:#fff;box-shadow:0 7px 0 #2E9142, 0 0 30px #A6E58A88;border:4px solid #fff">
          <div><div style="font-size:26px;font-weight:700;line-height:1">PLAY</div><div style="font-size:14px;font-weight:600">Sprout Quiz</div><div style="font-size:12px;opacity:.9">5 questions</div></div>
        </div>
      </div>
    </div>
    <div class="pad" style="display:grid;gap:12px">
      <div style="position:relative;background:var(--sun);border-radius:14px;padding:12px 14px 12px 18px;box-shadow:0 4px 0 var(--sunDark)">
        <div style="position:absolute;left:-8px;top:50%;width:16px;height:16px;border-radius:50%;background:var(--bg);transform:translateY(-50%)"></div>
        <div style="position:absolute;right:-8px;top:50%;width:16px;height:16px;border-radius:50%;background:var(--bg);transform:translateY(-50%)"></div>
        <div class="t-label">BONUS ROUND</div>
        <div class="t-head">3 tricky questions · 2 plants to check on</div>
        <div class="t-small" style="color:#6b5200">+1 leaf for each one you get right</div>
      </div>
      <div class="card row" style="background:var(--grapeTint);border-color:#D9CCFF"><div style="flex:1"><div class="t-label" style="color:var(--grapeDark)">CHALLENGE</div><div class="t-head">Sapling Quiz</div><div class="t-small">10 questions · Grades 5–6</div></div><div class="chip" style="background:#fff;color:var(--grapeDark)">Best 6/10</div></div>
      <div class="card row"><svg width="40" height="40" viewBox="0 0 40 40"><circle cx="14" cy="20" r="11" fill="#FFC93C"/><circle cx="26" cy="20" r="11" fill="#FF7A59" opacity=".9"/></svg><div style="flex:1"><div class="t-head">Match it</div><div class="t-small">What is each plant known for?</div></div><span class="chip">+12</span></div>
      <div class="t-title">Contestants</div>
      <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:6px">
        ${quizzes.map(q => `<div style="flex:none;width:96px;background:#fff;border:2px solid var(--border);border-bottom-width:4px;border-radius:16px;padding:8px 4px;text-align:center"><div style="width:58px;height:58px;margin:0 auto;border-radius:50%;background:${q.score ? 'var(--leafTint)' : 'var(--sunTint)'};display:grid;place-items:center">${plant(q.id, 44)}</div><div style="font-size:12.5px;font-weight:600;margin-top:4px">${q.name}</div><div class="chip" style="margin-top:3px;${q.score ? '' : 'background:var(--sunTint);color:#8a6200'}">${scoreText(q)}</div></div>`).join('')}
      </div>
      <div class="t-small">${lock()} 9 more contestants join as you explore.</div>
    </div></div>${nav}`,
});

// ---------------------------------------------------------------- B
designs.push({
  name: 'Big bright tiles', line: 'A neat grid of big buttons, easy to read at a glance. Plant quizzes slide sideways.',
  html: () => `<div class="scroll"><div class="pad">
    <div class="row" style="margin-bottom:12px"><div style="flex:1"><div class="t-display">Quiz</div><div class="t-small">Answer questions, earn leaves!</div></div><div class="card" style="padding:6px 10px;text-align:center;border-radius:14px"><div class="t-label" style="color:var(--muted)">BEST</div><div class="t-head">4/5</div></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;gap:10px">
      <div style="grid-row:span 2;background:linear-gradient(160deg,#7BE07F,#4CC35A);border-radius:22px;padding:14px;color:#fff;box-shadow:0 5px 0 var(--leafDark);display:flex;flex-direction:column">
        <div class="t-label" style="color:#E6F8DD">YOUR LEVEL</div><div class="t-title" style="color:#fff">Sprout Quiz</div><div style="font-size:12.5px">5 questions</div>
        <div class="bob" style="margin:auto auto 6px">${binhi(70)}</div>
        <div style="background:#fff;color:var(--leafDark);border-radius:12px;text-align:center;font-weight:700;padding:7px">PLAY</div>
      </div>
      <div style="background:var(--sky);border-radius:22px;padding:12px;box-shadow:0 5px 0 var(--skyDark)">
        <div class="t-label">REVIEW</div><div class="t-head">5 waiting</div><div style="font-size:12px">3 tricky · 2 plants</div>
        <svg width="40" height="34" viewBox="0 0 40 34" style="display:block;margin:6px 0 0 auto"><path d="M6 20 a14 14 0 1 1 6 10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M2 14 L6 22 L13 17" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="background:var(--grape);border-radius:22px;padding:12px;color:#fff;box-shadow:0 5px 0 var(--grapeDark)">
        <div class="t-label" style="color:#EFEAFF">CHALLENGE</div><div class="t-head">Sapling</div><div style="font-size:12px">10 questions</div><div style="font-size:12px;margin-top:6px;opacity:.9">Best 6/10</div>
      </div>
      <div style="grid-column:span 2;background:var(--sun);border-radius:22px;padding:12px 14px;box-shadow:0 5px 0 var(--sunDark)" class="row">
        <svg width="44" height="40" viewBox="0 0 40 40"><circle cx="14" cy="20" r="11" fill="#fff" opacity=".9"/><circle cx="26" cy="20" r="11" fill="#FF7A59"/></svg>
        <div style="flex:1"><div class="t-head">Match it</div><div style="font-size:12.5px">What is each plant known for?</div></div><span class="chip" style="background:#fff">+12</span>
      </div>
    </div>
    <div class="row" style="margin:18px 0 8px"><div class="t-title" style="flex:1">Plant quizzes</div><div class="t-small">3 of 6 done</div></div>
    <div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin:0 -16px;padding-left:16px">
      ${quizzes.map(q => { const f = q.score ? q.score[0] / q.score[1] : 0; return `<div style="flex:none;width:104px;background:#fff;border:2px solid var(--border);border-bottom-width:4px;border-radius:18px;padding:8px;text-align:center">
        <svg width="70" height="70" viewBox="0 0 70 70" style="display:block;margin:0 auto"><circle cx="35" cy="35" r="30" fill="${q.score ? '#F2FBEF' : '#FFF8E2'}" stroke="#EDE6D6" stroke-width="5"/>${q.score ? `<circle cx="35" cy="35" r="30" fill="none" stroke="#4CC35A" stroke-width="5" stroke-linecap="round" stroke-dasharray="${f * 188} 188" transform="rotate(-90 35 35)"/>` : ''}<g transform="translate(15 13)">${plant(q.id, 40)}</g></svg>
        <div style="font-size:13px;font-weight:600">${q.name}</div><div class="t-small" style="color:${q.score ? 'var(--leafDark)' : '#B07F00'};font-weight:700">${scoreText(q)}</div></div>`; }).join('')}
    </div>
    <div class="t-small">${lock()} 9 more unlock as you explore.</div>
  </div></div>${nav}`,
});

// ---------------------------------------------------------------- C
designs.push({
  name: 'Quest board', line: 'A wooden board with cards pinned on it. Review is today\'s quest on a sticky note; finished quizzes get a DONE stamp.',
  html: () => `<div class="scroll" style="background:#C9955B;background-image:radial-gradient(#B98348 1.2px, transparent 1.4px);background-size:9px 9px">
    <div class="pad">
      <div style="background:#8A5A2B;color:#fff;border-radius:12px;padding:8px 14px;box-shadow:0 4px 0 #5B3A1E;display:inline-block;transform:rotate(-1.5deg)"><div class="t-display" style="font-size:26px">Quest board</div></div>
      <div style="display:grid;gap:14px;margin-top:16px">
        ${pinned(`<div style="background:#FFF59A;padding:12px;transform:rotate(1.5deg);box-shadow:0 4px 8px #0003"><div class="t-label" style="color:#8a6200">TODAY'S QUEST</div><div class="t-head">Review 5 questions</div><div class="t-small" style="color:#6b5200">3 tricky ones + 2 plants to check on · +1 leaf each</div></div>`, '#FF5C7A')}
        ${pinned(`<div class="card row" style="transform:rotate(-1deg);border-radius:10px;box-shadow:0 4px 8px #0003">${binhi(46)}<div style="flex:1"><div class="t-label" style="color:var(--leafDark)">YOUR LEVEL</div><div class="t-title">Sprout Quiz</div><div class="t-small">5 questions · best 4/5</div></div><div class="btn" style="padding:8px 12px;font-size:14px">GO</div></div>`, '#4CC35A')}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          ${pinned(`<div class="card" style="transform:rotate(1.5deg);border-radius:10px;background:var(--grapeTint);box-shadow:0 4px 8px #0003"><div class="t-label" style="color:var(--grapeDark)">CHALLENGE</div><div class="t-head">Sapling</div><div class="t-small">10 questions</div></div>`, '#8E6CFF')}
          ${pinned(`<div class="card" style="transform:rotate(-2deg);border-radius:10px;background:var(--sunTint);box-shadow:0 4px 8px #0003"><div class="t-label" style="color:#8a6200">GAME</div><div class="t-head">Match it</div><div class="t-small">+12 leaves left</div></div>`, '#6EC6FF')}
        </div>
        <div style="background:#8A5A2B;color:#fff;border-radius:10px;padding:5px 12px;justify-self:start;box-shadow:0 3px 0 #5B3A1E" class="t-head">Plant quizzes</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
          ${quizzes.map((q, i) => `<div style="position:relative;background:#fff;padding:6px 6px 8px;box-shadow:0 3px 6px #0003;transform:rotate(${[-3, 2, -1, 3, -2, 1][i]}deg)">
            <div style="background:${q.score ? '#EAF7E4' : '#FFF6DA'};height:62px;display:grid;place-items:center">${plant(q.id, 46)}</div>
            <div style="font-size:12px;font-weight:600;text-align:center;margin-top:4px">${q.name}</div>
            ${q.score ? `<div style="position:absolute;right:-6px;top:30px;transform:rotate(-14deg);border:2.5px solid #2E9142;color:#2E9142;font-size:11px;font-weight:700;padding:0 5px;border-radius:6px;background:#ffffffcc">DONE ${q.score[0]}/${q.score[1]}</div>` : ''}
          </div>`).join('')}
        </div>
        <div style="color:#fff;font-size:13px;font-weight:600">${lock()} 9 more quests appear as you explore.</div>
      </div>
    </div></div>${nav}`,
});
function pinned(inner, pin) {
  return `<div style="position:relative">${inner}<div style="position:absolute;left:50%;top:-7px;width:14px;height:14px;border-radius:50%;background:${pin};box-shadow:inset -2px -2px 0 #0003, 0 2px 2px #0004;transform:translateX(-50%)"></div></div>`;
}

// ---------------------------------------------------------------- D
designs.push({
  name: 'School notebook', line: 'Lined paper and coloured tabs, like a real notebook. Scores look like a teacher\'s marks.',
  html: () => `<div class="scroll" style="background:#FFFDF6;background-image:linear-gradient(transparent 27px, #CFE3F5 28px);background-size:100% 28px">
    <div style="position:absolute;left:34px;top:0;bottom:0;width:2px;background:#F2A3A3"></div>

}

function balloon(x, y, r, c, tag, title, sub, big) {
  return `<g><path d="M${x} ${y + r * 1.05} Q${x - 8} ${y + r * 1.5} ${x + 4} ${y + r * 2}" stroke="#8A5A2B" stroke-width="1.5" fill="none"/>
    <g class="${big ? 'pulse' : ''}" style="transform-origin:${x}px ${y}px"><ellipse cx="${x}" cy="${y}" rx="${r * 0.92}" ry="${r}" fill="${c}" stroke="#263046" stroke-opacity=".2" stroke-width="3"/>
    <path d="M${x - 6} ${y + r} L${x + 6} ${y + r} L${x} ${y + r + 8}Z" fill="${c}"/>
    <ellipse cx="${x - r * 0.35}" cy="${y - r * 0.4}" rx="${r * 0.18}" ry="${r * 0.28}" fill="#fff" opacity=".45"/>
    <text x="${x}" y="${y - (big ? 14 : 6)}" text-anchor="middle" font-family="Fredoka" font-size="${big ? 11 : 8.5}" font-weight="700" letter-spacing="1" fill="#fff" opacity=".9">${tag}</text>
    <text x="${x}" y="${y + (big ? 8 : 8)}" text-anchor="middle" font-family="Fredoka" font-size="${big ? 20 : 13}" font-weight="700" fill="#fff">${title}</text>
    ${sub ? `<text x="${x}" y="${y + 26}" text-anchor="middle" font-family="Fredoka" font-size="12" font-weight="600" fill="#fff">${sub}</text>` : ''}</g></g>`;
}
