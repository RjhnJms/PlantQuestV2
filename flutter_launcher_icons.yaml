# App icon (PLAN.md §11). Images are drawn by tool/render_brand_test.dart.
# Regenerate: flutter test tool/render_brand_test.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/brand/icon_background.png"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  remove_alpha_ios: true
  background_color_ios: "#B8E8FF"
  web:
    generate: true
    image_path: "assets/brand/icon.png"
    background_color: "#FFF9EC"
    theme_color: "#4CC35A"
