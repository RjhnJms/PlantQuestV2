name: plantquest
description: "PlantQuest: an offline plant learning game for kids."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.8.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  file_picker: ^13.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_tts: ^4.2.5
  go_router: ^18.1.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: ^2.2.16

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/wooden/
    - assets/sounds/garden/
    - assets/music/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
